<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waste Management</title>
<style>
  :root {
    color-scheme: light;
    --plane:      #f9f9f7;
    --surface:    #fcfcfb;
    --ink:        #0b0b0b;
    --ink-2:      #52514e;
    --muted:      #898781;
    --hairline:   #e1e0d9;
    --border:     rgba(11, 11, 11, 0.10);

    /* Status palette - fixed, never themed. Always paired with icon + label. */
    --good:     #0ca30c;
    --warning:  #fab219;
    --serious:  #ec835a;
    --critical: #d03b3b;
    --track:    #e1e0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane:    #0d0d0d;
      --surface:  #1a1a19;
      --ink:      #ffffff;
      --ink-2:    #c3c2b7;
      --muted:    #898781;
      --hairline: #2c2c2a;
      --border:   rgba(255, 255, 255, 0.10);
      --track:    #2c2c2a;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px 64px;
    background: var(--plane);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); font-weight: 600; margin: 32px 0 12px; }

  /* --- Stat tiles ------------------------------------------------------ */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .tile .value { font-size: 30px; font-weight: 600; line-height: 1.2; margin-top: 2px; }

  /* --- Bin cards ------------------------------------------------------- */
  .bins { display: grid; gap: 12px; }
  .bin {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
    display: grid; gap: 10px;
    grid-template-columns: 1fr auto; align-items: start;
  }
  .bin-name { font-weight: 600; }
  .bin-meta { color: var(--muted); font-size: 13px; }

  /* Meter: thin mark, rounded data-end anchored to the baseline. */
  .meter { grid-column: 1 / -1; }
  .meter-track {
    height: 10px; background: var(--track); border-radius: 5px; overflow: hidden;
  }
  .meter-fill {
    height: 100%; border-radius: 0 4px 4px 0; min-width: 3px;
    transition: width .3s ease;
  }
  .meter-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 5px; gap: 12px;
  }
  .pct { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Status badge: icon + text, so color never carries meaning alone. */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; padding: 3px 9px;
    border-radius: 999px; border: 1px solid currentColor;
    white-space: nowrap;
  }
  .badge .dot { font-size: 10px; }

  button {
    font: inherit; font-size: 13px; padding: 7px 13px; cursor: pointer;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 7px;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }

  /* --- Table ----------------------------------------------------------- */
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--hairline); }
  th { color: var(--muted); font-weight: 600; font-size: 12px;
       text-transform: uppercase; letter-spacing: .05em; }
  td.time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* --- Forms / misc ---------------------------------------------------- */
  input {
    font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  .gate { max-width: 380px; margin: 80px auto; text-align: center; }
  .gate input { width: 100%; margin: 12px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .empty { color: var(--muted); padding: 24px 0; }
  .token-note {
    background: var(--surface); border: 1px solid var(--warning);
    border-radius: 8px; padding: 12px 14px; margin-top: 12px; font-size: 13px;
  }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
         word-break: break-all; }
  .err { color: var(--critical); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Token gate -->
  <div id="gate" class="gate" hidden>
    <h1>Waste Management</h1>
    <p class="sub">Enter the admin token from your <code>.env</code>.</p>
    <input id="token-input" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" />
    <button class="primary" id="unlock">Unlock</button>
    <p class="err" id="gate-error" hidden>Token rejected.</p>
  </div>

  <!-- Dashboard -->
  <div id="app" hidden>
    <header>
      <h1>Waste Management</h1>
      <button id="refresh">Refresh</button>
      <button id="lock">Lock</button>
    </header>
    <p class="sub" id="status-line">Loading…</p>

    <div class="tiles" id="tiles"></div>

    <h2>Bins</h2>
    <div class="bins" id="bins"></div>

    <h2>Add a bin</h2>
    <div class="row">
      <input id="new-name" placeholder="Name (e.g. Kitchen Bin)" />
      <input id="new-location" placeholder="Location" />
      <input id="new-empty" type="number" placeholder="Empty mm" style="width:110px" />
      <input id="new-full" type="number" placeholder="Full mm" style="width:110px" />
      <button class="primary" id="add-bin">Register</button>
    </div>
    <div id="new-token" class="token-note" hidden></div>

    <h2>Recent events</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Time</th><th>Bin</th><th>Event</th><th>Message</th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </div>
    <p class="empty" id="events-empty" hidden>No events yet.</p>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const STORE_KEY = "wm.adminToken";
let token = localStorage.getItem(STORE_KEY) || "";
let bins = [];

// --- API ------------------------------------------------------------------
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {
      authorization: `Bearer ${token}`,
      ...(body ? { "content-type": "application/json" } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { lock(); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}

// --- Status classification ------------------------------------------------
// Every status returns an icon AND a label; color is never the only channel.
function classify(bin) {
  if (bin.online === 0) return { key: "offline", color: "var(--muted)", icon: "✕", label: "Offline" };
  if (bin.state === "FULL") return { key: "full", color: "var(--critical)", icon: "■", label: "Full" };

  const level = bin.last_level_pct;
  if (level == null) return { key: "new", color: "var(--muted)", icon: "○", label: "No data" };
  if (level >= bin.full_threshold_pct)
    return { key: "confirming", color: "var(--serious)", icon: "▲", label: "Nearly full" };
  if (level > bin.clear_threshold_pct)
    return { key: "filling", color: "var(--warning)", icon: "●", label: "Filling" };
  return { key: "ok", color: "var(--good)", icon: "✓", label: "OK" };
}

const ago = (ms) => {
  if (!ms) return "never";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
};

// Build nodes with textContent - never innerHTML with server data.
function el(tag, opts = {}, children = []) {
  const node = document.createElement(tag);
  if (opts.class) node.className = opts.class;
  if (opts.text != null) node.textContent = opts.text;
  if (opts.style) node.setAttribute("style", opts.style);
  for (const [k, v] of Object.entries(opts.attrs || {})) node.setAttribute(k, v);
  if (opts.onClick) node.addEventListener("click", opts.onClick);
  for (const c of children) node.append(c);
  return node;
}

function badge(status) {
  return el("span", { class: "badge", style: `color:${status.color}` }, [
    el("span", { class: "dot", text: status.icon }),
    el("span", { text: status.label }),
  ]);
}

// --- Render ---------------------------------------------------------------
function renderTiles() {
  const full = bins.filter((b) => b.state === "FULL").length;
  const offline = bins.filter((b) => b.online === 0).length;
  const lowBattery = bins.filter((b) => b.battery_alerted === 1).length;

  const tiles = [
    { label: "Bins", value: bins.length, icon: "▣", color: "var(--ink-2)" },
    { label: "Full now", value: full, icon: "■", color: full ? "var(--critical)" : "var(--good)" },
    { label: "Offline", value: offline, icon: "✕", color: offline ? "var(--serious)" : "var(--good)" },
    { label: "Low battery", value: lowBattery, icon: "⚡", color: lowBattery ? "var(--warning)" : "var(--good)" },
  ];

  $("tiles").replaceChildren(
    ...tiles.map((t) =>
      el("div", { class: "tile" }, [
        el("div", { class: "label" }, [
          el("span", { text: t.icon, style: `color:${t.color}` }),
          el("span", { text: t.label }),
        ]),
        el("div", { class: "value", text: String(t.value) }),
      ]),
    ),
  );
}

function renderBins() {
  const container = $("bins");
  if (bins.length === 0) {
    container.replaceChildren(el("p", { class: "empty", text: "No bins registered yet." }));
    return;
  }

  container.replaceChildren(
    ...bins.map((bin) => {
      const status = classify(bin);
      const level = bin.last_level_pct ?? 0;

      const meta = [
        bin.location,
        `last seen ${ago(bin.last_seen_at)}`,
        bin.id,
      ].filter(Boolean).join(" · ");

      const fill = el("div", {
        class: "meter-fill",
        style: `width:${Math.max(0, Math.min(100, level))}%; background:${status.color}`,
      });

      const track = el("div", {
        class: "meter-track",
        attrs: {
          role: "progressbar",
          "aria-valuenow": String(level),
          "aria-valuemin": "0",
          "aria-valuemax": "100",
          "aria-label": `${bin.name} fill level`,
        },
      }, [fill]);

      return el("div", { class: "bin" }, [
        el("div", {}, [
          el("div", { class: "bin-name", text: bin.name }),
          el("div", { class: "bin-meta", text: meta }),
        ]),
        el("div", { class: "row" }, [
          badge(status),
          el("button", {
            text: "Mark collected",
            onClick: async (e) => {
              e.target.disabled = true;
              try { await api("POST", `/api/v1/bins/${bin.id}/collected`); await load(); }
              catch (err) { alert(err.message); e.target.disabled = false; }
            },
          }),
        ]),
        el("div", { class: "meter" }, [
          el("div", { class: "meter-row" }, [
            el("span", { class: "pct", text: `${level}%` }),
            el("span", {
              class: "bin-meta",
              text: `alert at ${bin.full_threshold_pct}% · clears below ${bin.clear_threshold_pct}%`,
            }),
          ]),
          track,
        ]),
      ]);
    }),
  );
}

function renderEvents(events) {
  const names = new Map(bins.map((b) => [b.id, b.name]));
  $("events-empty").hidden = events.length > 0;

  $("events").replaceChildren(
    ...events.map((ev) =>
      el("tr", {}, [
        el("td", { class: "time", text: new Date(ev.created_at).toLocaleString() }),
        el("td", { text: names.get(ev.bin_id) || ev.bin_id }),
        el("td", { text: ev.type }),
        el("td", { text: ev.message }),
      ]),
    ),
  );
}

// --- Load / auth ----------------------------------------------------------
async function load() {
  try {
    const [binsRes, eventsRes, health] = await Promise.all([
      api("GET", "/api/v1/bins"),
      api("GET", "/api/v1/events?limit=50"),
      api("GET", "/api/v1/health"),
    ]);
    bins = binsRes.bins;
    renderTiles();
    renderBins();
    renderEvents(eventsRes.events);
    $("status-line").textContent =
      `Updated ${new Date().toLocaleTimeString()} · ` +
      (health.alerts_configured ? "Telegram alerts active" : "Alerts logging to console only");
  } catch (err) {
    if (err.message !== "unauthorized") $("status-line").textContent = `Error: ${err.message}`;
  }
}

function unlock() { $("gate").hidden = true; $("app").hidden = false; load(); }
function lock() {
  localStorage.removeItem(STORE_KEY);
  token = "";
  $("app").hidden = true;
  $("gate").hidden = false;
  $("gate-error").hidden = false;
}

$("unlock").addEventListener("click", async () => {
  token = $("token-input").value.trim();
  try {
    await api("GET", "/api/v1/bins");
    localStorage.setItem(STORE_KEY, token);
    $("gate-error").hidden = true;
    unlock();
  } catch { $("gate-error").hidden = false; }
});
$("token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("unlock").click(); });
$("refresh").addEventListener("click", load);
$("lock").addEventListener("click", lock);

$("add-bin").addEventListener("click", async () => {
  const body = {
    name: $("new-name").value.trim(),
    location: $("new-location").value.trim() || undefined,
    empty_distance_mm: Number($("new-empty").value) || undefined,
    full_distance_mm: Number($("new-full").value) || undefined,
  };
  if (!body.name) return alert("Name is required");

  try {
    const res = await api("POST", "/api/v1/bins", body);
    const note = $("new-token");
    note.replaceChildren(
      el("strong", { text: "Save this device token now - it is shown only once:" }),
      el("div", {}, [el("code", { text: res.device_token })]),
      el("div", { class: "bin-meta", text: `Bin id: ${res.bin.id}` }),
    );
    note.hidden = false;
    ["new-name", "new-location", "new-empty", "new-full"].forEach((id) => ($(id).value = ""));
    await load();
  } catch (err) { alert(err.message); }
});

// Boot
if (token) unlock(); else $("gate").hidden = false;
setInterval(() => { if (!$("app").hidden) load(); }, 15000);
</script>
</body>
</html>
