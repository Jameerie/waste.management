; ESP32 bin sensor.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; Copy src/config.example.h to src/config.h and fill it in first.
; config.h is gitignored - it holds WiFi credentials and the device token.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
